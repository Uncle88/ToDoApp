trigger:
- dev

pool:
  vmImage: 'ubuntu-latest' # Default pool; overridden per job.

stages:
- stage: Build
  displayName: 'Build Flutter App'
  jobs:

  # Android Build Job
  - job: AndroidBuild
    displayName: 'Build Android APK'
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0 # Ensure Python is installed
      inputs:
        versionSpec: '3.x'
        addToPath: true

    - script: |
        sudo apt-get update
        sudo apt-get install -y git unzip xz-utils curl
      displayName: 'Install Dependencies'

- task: Bash@3
  displayName: 'Install Flutter SDK'
  inputs:
    targetType: 'inline'
    script: |
      git clone https://github.com/flutter/flutter.git -b stable $FLUTTER_PATH
      echo "##vso[task.prependpath]$FLUTTER_PATH/bin"
      flutter --version

    - script: |
        flutter pub get
        flutter build apk --release
      displayName: 'Build APK'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'build/app/outputs/flutter-apk/'
        artifact: 'AndroidAPK'
      displayName: 'Publish Android APK Artifact'