trigger:
- dev # Replace 'main' with your default branch name if different


pool:
  vmImage: 'ubuntu-latest'


variables:
  flutterSdkPath: $(Agent.ToolsDirectory)/flutter


steps:


  - task: Bash@3
    name: InstallFlutter
    displayName: 'Install Flutter'
    inputs:
      targetType: 'inline'
      script: |
        git clone --branch $(FlutterVersionTag) https://github.com/flutter/flutter.git
        export PATH="$PATH:`pwd`/flutter/bin"
        echo "##vso[task.setvariable variable=JAVA_HOME]$(JavaSdkDirectory)"
        export JAVA_HOME=$(JavaSdkDirectory)
        echo "##vso[task.setvariable variable=PATH]$(JavaSdkDirectory)/bin:$PATH"
        export PATH="$PATH:$(JavaSdkDirectory)/bin"
        flutter precache
        yes | flutter doctor --android-licenses
        flutter doctor -v


- script: |
    sudo apt-get update
    sudo apt-get install -y git curl python3
  displayName: 'Install Dependencies'


- script: |
    flutter pub get
    flutter build apk --release
  displayName: 'Build Flutter App'


- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'build/app/outputs/flutter-apk/' # Path to the APK/IPA file
    artifact: 'FlutterApp'

