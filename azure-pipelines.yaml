trigger:
- dev # Replace 'main' with your default branch name if different

pool:
  vmImage: 'ubuntu-latest'

variables:
  flutterSdkPath: $(Agent.ToolsDirectory)/flutter

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.x' # Flutter needs Python for some dependencies
    addToPath: true

- script: |
    echo "Agent Tools Directory: $(Agent.ToolsDirectory)"
    echo "Flutter SDK Path: $(flutterSdkPath)"
    ls $(flutterSdkPath)
    flutter --version
  displayName: 'Debug Flutter SDK Installation'

- script: |
    # Install Flutter SDK
    git clone https://github.com/flutter/flutter.git -b stable $(flutterSdkPath)
    echo "##vso[task.prependpath]$(flutterSdkPath)/bin"
    flutter --version
  displayName: 'Install Flutter SDK'

- script: |
    flutter pub get
    flutter build apk # Or `flutter build ios` for iOS
  displayName: 'Build Flutter App'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: 'build/app/outputs/flutter-apk/' # Path to the APK/IPA file
    artifact: 'FlutterApp'

